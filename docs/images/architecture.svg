<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" role="img" aria-label="IoT platform architecture" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .cluster { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .cluster-label { font-size: 13px; font-weight: 600; fill: #64748B; letter-spacing: 0.4px; }
      .node-title { font-size: 15px; font-weight: 600; }
      .node-sub { font-size: 11.5px; fill: #64748B; }
      .edge { fill: none; stroke: #64748B; stroke-width: 1.8; }
      .edge-dotted { fill: none; stroke: #94A3B8; stroke-width: 1.6; stroke-dasharray: 2 4; }
      .edge-label { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .note { font-size: 11.5px; fill: #94A3B8; }
      .dev  { fill: #F3F4F6; stroke: #9CA3AF; }
      .devt { fill: #374151; }
      .emqx { fill: #FEF3C7; stroke: #F59E0B; }
      .emqxt { fill: #92400E; }
      .svc  { fill: #EFF6FF; stroke: #3B82F6; }
      .svct { fill: #1E3A8A; }
      .store { fill: #ECFDF5; stroke: #10B981; }
      .storet { fill: #065F46; }
      .obs  { fill: #FFF7ED; stroke: #F97316; }
      .obst { fill: #9A3412; }
      .demo { fill: #F5F3FF; stroke: #8B5CF6; }
      .demot { fill: #5B21B6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  <!-- cluster boxes -->
  <rect class="cluster" x="500" y="40" width="300" height="500" rx="12"/>
  <text class="cluster-label" x="650" y="66" text-anchor="middle">Kubernetes · namespace iot · Helm</text>
  <rect class="cluster" x="860" y="40" width="320" height="460" rx="12"/>
  <text class="cluster-label" x="1020" y="66" text-anchor="middle">数据与消息基础设施（独立平台 / Docker）</text>
  <rect class="cluster" x="60" y="560" width="380" height="120" rx="12"/>
  <text class="cluster-label" x="250" y="586" text-anchor="middle">可观测性（Docker Compose）</text>

  <!-- edges -->
  <path class="edge" d="M210,352 L270,352" marker-end="url(#arr)"/>
  <text class="edge-label" x="240" y="342" text-anchor="middle">MQTT :1883</text>

  <path class="edge" d="M440,352 L530,352" marker-end="url(#arr)"/>
  <text class="edge-label" x="485" y="342" text-anchor="middle">telemetry 订阅</text>

  <path class="edge" d="M355,384 L355,452 L530,452" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="edge-label" x="442" y="442" text-anchor="middle">command↓ / ack↑</text>

  <path class="edge" d="M355,320 L355,212 L530,212" marker-end="url(#arr)"/>
  <text class="edge-label" x="440" y="202" text-anchor="middle">authn/authz 回调</text>

  <path class="edge" d="M650,144 L650,180" marker-end="url(#arr)"/>
  <text class="edge-label" x="660" y="166" text-anchor="start">gRPC mTLS</text>

  <path class="edge" d="M770,222 L820,222 L820,272 L890,272" marker-end="url(#arr)"/>
  <text class="edge-label" x="856" y="262" text-anchor="middle">业务读写</text>

  <path class="edge" d="M770,200 L806,200 L806,132 L890,132" marker-end="url(#arr)"/>
  <text class="edge-label" x="848" y="122" text-anchor="middle">iot.command</text>

  <path class="edge" d="M770,352 L840,352 L840,150 L890,150" marker-end="url(#arr)"/>
  <text class="edge-label" x="805" y="342" text-anchor="middle">iot.telemetry</text>

  <path class="edge" d="M770,442 L855,442 L855,290 L890,290" marker-end="url(#arr)"/>
  <text class="edge-label" x="812" y="432" text-anchor="middle">状态变更</text>

  <path class="edge" d="M770,462 L872,462 L872,412 L890,412" marker-end="url(#arr)"/>
  <text class="edge-label" x="821" y="452" text-anchor="middle">时序写入</text>

  <path class="edge" d="M240,124 L240,290 Q240,320 270,320" marker-end="url(#arr)"/>
  <text class="edge-label" x="250" y="212" text-anchor="start">MQTT 造流</text>

  <path class="edge" d="M280,92 L470,92 L470,112 L530,112" marker-end="url(#arr)"/>
  <text class="edge-label" x="375" y="82" text-anchor="middle">REST 创建命令</text>

  <path class="edge-dotted" d="M250,645 L470,645 L470,500 L500,500" marker-end="url(#arr)"/>
  <text class="edge-label" x="360" y="637" text-anchor="middle">scrape /metrics ×4 + demo</text>

  <path class="edge" d="M290,615 L250,615" marker-end="url(#arr)"/>

  <!-- nodes -->
  <g>
    <rect class="dev" x="60" y="320" width="150" height="64" rx="10"/>
    <text class="node-title devt" x="135" y="346" text-anchor="middle">设备 Devices</text>
    <text class="node-sub" x="135" y="368" text-anchor="middle">MQTT 客户端</text>
  </g>
  <g>
    <rect class="emqx" x="270" y="320" width="170" height="64" rx="10"/>
    <text class="node-title emqxt" x="355" y="346" text-anchor="middle">EMQX</text>
    <text class="node-sub" x="355" y="368" text-anchor="middle">ns: emqx · Operator</text>
  </g>
  <g>
    <rect class="demo" x="60" y="60" width="220" height="64" rx="10"/>
    <text class="node-title demot" x="170" y="86" text-anchor="middle">demo 模拟器</text>
    <text class="node-sub" x="170" y="108" text-anchor="middle">多租户造流 + 自动 ACK</text>
  </g>

  <g>
    <rect class="svc" x="530" y="80" width="240" height="64" rx="10"/>
    <text class="node-title svct" x="650" y="106" text-anchor="middle">management-api</text>
    <text class="node-sub" x="650" y="128" text-anchor="middle">REST :8080 · Bearer Token</text>
  </g>
  <g>
    <rect class="svc" x="530" y="180" width="240" height="64" rx="10"/>
    <text class="node-title svct" x="650" y="206" text-anchor="middle">iot-core</text>
    <text class="node-sub" x="650" y="228" text-anchor="middle">gRPC :9001 · mTLS · 命令调度</text>
  </g>
  <g>
    <rect class="svc" x="530" y="320" width="240" height="64" rx="10"/>
    <text class="node-title svct" x="650" y="346" text-anchor="middle">telemetry-ingestor</text>
    <text class="node-sub" x="650" y="368" text-anchor="middle">MQTT 标准化 → Kafka</text>
  </g>
  <g>
    <rect class="svc" x="530" y="420" width="240" height="64" rx="10"/>
    <text class="node-title svct" x="650" y="446" text-anchor="middle">device-worker</text>
    <text class="node-sub" x="650" y="468" text-anchor="middle">Kafka 消费 · 落库 · 命令投递</text>
  </g>
  <text class="note" x="650" y="520" text-anchor="middle">探针 · HPA · PDB · 滚动更新 · 拓扑分散</text>

  <g>
    <rect class="store" x="890" y="100" width="260" height="64" rx="10"/>
    <text class="node-title storet" x="1020" y="126" text-anchor="middle">Kafka</text>
    <text class="node-sub" x="1020" y="148" text-anchor="middle">iot.telemetry · iot.command · iot.dlq</text>
  </g>
  <g>
    <rect class="store" x="890" y="240" width="260" height="64" rx="10"/>
    <text class="node-title storet" x="1020" y="266" text-anchor="middle">PostgreSQL</text>
    <text class="node-sub" x="1020" y="288" text-anchor="middle">元数据 · 命令状态 · 完整载荷 JSONB</text>
  </g>
  <g>
    <rect class="store" x="890" y="380" width="260" height="64" rx="10"/>
    <text class="node-title storet" x="1020" y="406" text-anchor="middle">TDengine</text>
    <text class="node-sub" x="1020" y="428" text-anchor="middle">时序数据（设备子表 + tags）</text>
  </g>

  <g>
    <rect class="obs" x="90" y="600" width="160" height="60" rx="10"/>
    <text class="node-title obst" x="170" y="636" text-anchor="middle">Prometheus</text>
  </g>
  <g>
    <rect class="obs" x="290" y="600" width="160" height="60" rx="10"/>
    <text class="node-title obst" x="370" y="636" text-anchor="middle">Grafana</text>
  </g>

  <!-- legend -->
  <g font-size="11.5px" fill="#64748B">
    <rect class="svc" x="505" y="694" width="12" height="12" rx="3"/>
    <text x="523" y="704">业务服务（Go）</text>
    <rect class="emqx" x="640" y="694" width="12" height="12" rx="3"/>
    <text x="658" y="704">接入层</text>
    <rect class="store" x="740" y="694" width="12" height="12" rx="3"/>
    <text x="758" y="704">数据 / 消息</text>
    <rect class="demo" x="860" y="694" width="12" height="12" rx="3"/>
    <text x="878" y="704">模拟器</text>
    <rect class="obs" x="960" y="694" width="12" height="12" rx="3"/>
    <text x="978" y="704">可观测性</text>
  </g>
</svg>
