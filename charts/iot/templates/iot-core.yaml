apiVersion: v1
kind: Service
metadata:
  name: iot-core
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  selector:
    app: iot-core
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
    - name: metrics
      port: 9101
      targetPort: 9101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.iotCore }}
  selector:
    matchLabels:
      app: iot-core
  template:
    metadata:
      labels:
        app: iot-core
    spec:
      {{- if .Values.externalDependencies.hostGatewayIP }}
      hostAliases:
        - ip: {{ .Values.externalDependencies.hostGatewayIP | quote }}
          hostnames:
            - host.docker.internal
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z {{ .Values.externalDependencies.wait.postgresHost }} {{ .Values.externalDependencies.wait.postgresPort }}
              && nc -z {{ .Values.externalDependencies.wait.kafkaHost }} {{ .Values.externalDependencies.wait.kafkaPort }};
              do echo waiting for docker postgres/kafka; sleep 2; done
      containers:
        - name: iot-core
          image: {{ .Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/iot-core"]
          envFrom:
            - configMapRef:
                name: iot-common-config
          ports:
            - containerPort: 9001
            - containerPort: 9101
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 10
