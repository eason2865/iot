<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 754" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<title id="title">IoT 3.1 系统架构</title><desc id="desc">设备流量和可选的运维诊断服务独立运行。</desc>
