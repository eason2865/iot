<text x="511.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Kafka</text>
<text x="511.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">iot.command</text>
<path d="M595 241 L625 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
