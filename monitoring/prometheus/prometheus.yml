global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: admin
    static_configs:
      - targets:
          - k8s-forward-admin-metrics:18090

  - job_name: ingress
    static_configs:
      - targets:
          - k8s-forward-ingress:18081

  - job_name: worker
    static_configs:
      - targets:
          - k8s-forward-worker:18082

  - job_name: core-rpc
    static_configs:
      - targets:
          - k8s-forward-core-rpc:18091

  - job_name: demo-docker
    static_configs:
      - targets:
          - demo:8080
