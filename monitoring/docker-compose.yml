name: iot

services:
  k8s-forward-management-api:
    image: rancher/kubectl:v1.34.9
    container_name: iot-k8s-forward-management-api
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/management-api", "18080:8080", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]
    ports:
      - "127.0.0.1:18080:18080"

  # The former per-Service metrics port-forwards are gone: Prometheus now
  # discovers and scrapes every Pod individually through the apiserver pod
  # proxy (see prometheus/prometheus.yml and prometheus/k8s-rbac.yaml), so a
  # multi-replica deployment no longer monitors only the one Pod a
  # Service-forward happened to land on.

  k8s-forward-emqx-listeners:
    image: rancher/kubectl:v1.34.9
    container_name: iot-k8s-forward-emqx-listeners
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/emqx-listeners", "1883:1883", "-n", "emqx"]
    # 不再映射宿主机 1883：Docker Desktop 的 cloud-provider-kind（kindccm 容器）
    # 已把 LoadBalancer 类型的 emqx-listeners 直接发布到宿主机 1883，再绑会冲突。
    # 本容器只为 default/kind docker 网络内的 demo 提供 k8s-forward-emqx-listeners:1883。
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  # k8s-forward-emqx-dashboard 已删除：emqx-dashboard 是 LoadBalancer，
  # Docker Desktop cloud-provider-kind 已把 18083 直接发布到宿主机，无需转发容器。

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot123}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnamilegacy/kafka:4.0.0@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://192.168.65.254:29092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: HOST
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka

  tdengine:
    image: tdengine/tdengine:3.3.6.13@sha256:79d32ce8a42f64c7dbfc33946a36b3e176ea23c0cd695a1bc9e8aa889ca03b88
    container_name: tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6044:6044"
      - "6046:6046"
      - "6047:6047"
      - "6048:6048"
      - "6049:6049"
      - "6060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
      - tdengine-corefile:/corefile

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    networks: [default, kind]
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ServiceAccount token for apiserver pod discovery/proxy scraping;
      # provisioned by scripts/port-forward-local-monitoring.sh.
      - ./prometheus/k8s-token:/etc/prometheus/k8s/token:ro
      - ./prometheus/k8s-ca.crt:/etc/prometheus/k8s/ca.crt:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  demo:
    image: iot-app:2.42
    container_name: iot-demo
    restart: unless-stopped
    command: ["/usr/local/bin/demo"]
    ports:
      - "18084:8080"
    environment:
      DEMO_MANAGEMENT_API_URL: http://k8s-forward-management-api:18080
      DEMO_MQTT_URL: tcp://k8s-forward-emqx-listeners:1883
      DEMO_MANAGEMENT_API_TOKEN: ${IOT_MANAGEMENT_API_TOKEN:-local-development-token}
      DEMO_MQTT_USERNAME: iot-service
      DEMO_MQTT_PASSWORD: ${IOT_EMQX_INTERNAL_PASSWORD:-local-mqtt-service-password}
      DEMO_TENANT_COUNT: "5"
      DEMO_DEVICES_PER_TENANT: "10"
      DEMO_TENANT_PREFIX: demo
      DEMO_PRODUCT_ID: product-demo
      DEMO_TICK_INTERVAL: 250ms
      DEMO_TELEMETRY_BURST_MIN: "1"
      DEMO_TELEMETRY_BURST_MAX: "5"
      DEMO_COMMAND_BURST_MIN: "1"
      DEMO_COMMAND_BURST_MAX: "3"
      LISTEN_ADDR: :8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      k8s-forward-emqx-listeners:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  postgres-data:
    name: iot-postgres-data
  kafka-data:
    name: iot-kafka-data
  tdengine-data:
    name: iot-tdengine-data
  tdengine-log:
    name: iot-tdengine-log
  tdengine-corefile:
    name: iot-tdengine-corefile
  prometheus-data:
    name: iot-prometheus-data
  grafana-data:
    name: iot-grafana-data

networks:
  kind:
    external: true
    name: kind
