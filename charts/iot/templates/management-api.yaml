apiVersion: v1
kind: Service
metadata:
  name: management-api
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  selector:
    app: management-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-api
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.managementAPI }}
  selector:
    matchLabels:
      app: management-api
  template:
    metadata:
      labels:
        app: management-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.externalDependencies.hostGatewayIP }}
      hostAliases:
        - ip: {{ .Values.externalDependencies.hostGatewayIP | quote }}
          hostnames:
            - host.docker.internal
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - >
              until nc -z iot-core 9001;
              do echo waiting for iot-core; sleep 2; done
      containers:
        - name: management-api
          image: {{ .Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/management-api"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources.managementAPI | nindent 12 }}
          envFrom:
            - configMapRef:
                name: iot-common-config
            - secretRef:
                name: {{ .Values.security.existingSecret }}
          {{- if .Values.grpcTLS.enabled }}
          env:
            - name: IOT_CORE_TLS_CERT
              value: {{ .Values.grpcTLS.mountPath }}/client.crt
            - name: IOT_CORE_TLS_KEY
              value: {{ .Values.grpcTLS.mountPath }}/client.key
            - name: IOT_CORE_TLS_CA
              value: {{ .Values.grpcTLS.mountPath }}/ca.crt
            - name: IOT_CORE_TLS_SERVER_NAME
              value: iot-core
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
          {{- if .Values.grpcTLS.enabled }}
          volumeMounts:
            - name: grpc-tls
              mountPath: {{ .Values.grpcTLS.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      {{- if .Values.grpcTLS.enabled }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ .Values.grpcTLS.secretName }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: management-api
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: management-api
