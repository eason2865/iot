apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingestor
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  selector:
    app: telemetry-ingestor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingestor
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.telemetryIngestor }}
  selector:
    matchLabels:
      app: telemetry-ingestor
  template:
    metadata:
      labels:
        app: telemetry-ingestor
    spec:
      {{- if .Values.externalDependencies.hostGatewayIP }}
      hostAliases:
        - ip: {{ .Values.externalDependencies.hostGatewayIP | quote }}
          hostnames:
            - host.docker.internal
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z {{ .Values.externalDependencies.wait.postgresHost }} {{ .Values.externalDependencies.wait.postgresPort }}
              && nc -z {{ .Values.externalDependencies.wait.kafkaHost }} {{ .Values.externalDependencies.wait.kafkaPort }}
              && nc -z {{ .Values.externalDependencies.wait.emqxHost }} {{ .Values.externalDependencies.wait.emqxPort }};
              do echo waiting for docker postgres/kafka/emqx; sleep 2; done
      containers:
        - name: telemetry-ingestor
          image: {{ .Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/telemetry-ingestor"]
          envFrom:
            - configMapRef:
                name: iot-common-config
          env:
            - name: EMQX_CLIENT_ID_SUFFIX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
