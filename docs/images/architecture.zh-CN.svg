<text x="511.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">标准化</text>
<path d="M595 129 L625 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
