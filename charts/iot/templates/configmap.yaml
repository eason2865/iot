apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-common-config
  labels:
    {{- include "iot.labels" . | nindent 4 }}
data:
  # DSNs contain credentials and live in the Secret (security.existingSecret),
  # not in this ConfigMap: POSTGRES_DSN, TDENGINE_DSN.
  KAFKA_BROKERS: {{ .Values.externalDependencies.kafkaBrokers | quote }}
  EMQX_URL: {{ .Values.externalDependencies.emqxUrl | quote }}
  IOT_CORE_ENDPOINTS: iot-core:9001
  KAFKA_TELEMETRY_TOPIC: iot.telemetry
  KAFKA_COMMAND_TOPIC: iot.command
  KAFKA_DLQ_TOPIC: iot.dlq
  # Durability of the topics this release creates. See docs/adr/0004.
  KAFKA_TOPIC_REPLICATION_FACTOR: {{ .Values.kafka.topicReplicationFactor | quote }}
  KAFKA_TOPIC_MIN_INSYNC_REPLICAS: {{ .Values.kafka.topicMinInsyncReplicas | quote }}
  EMQX_TOPIC_FILTER: "$share/iot-telemetry/tenant/+/device/+/telemetry"
  EMQX_ACK_TOPIC_FILTER: "$share/iot-device-worker/tenant/+/device/+/ack"
  EMQX_TELEMETRY_INGESTOR_CLIENT_ID: iot-telemetry-ingestor
  EMQX_DEVICE_WORKER_CLIENT_ID: iot-device-worker
  # Empty means the worker processes every tenant. A CSV list restricts it; the
  # MQTT subscription stays a wildcard and the worker drops the other tenants.
  DEVICE_WORKER_TENANT_IDS: {{ .Values.deviceWorker.tenantIDs | quote }}
  TDENGINE_TABLE: telemetry_v2
  LISTEN_ADDR: :8080
  MANAGEMENT_API_METRICS_HOST: 0.0.0.0
  MANAGEMENT_API_METRICS_PORT: "9100"
  MANAGEMENT_API_METRICS_PATH: /metrics
  IOT_CORE_LISTEN_ON: :9001
  IOT_CORE_MQTT_AUTH_LISTEN: :9090
  COMMAND_ACK_TIMEOUT: 5m
  EMQX_USERNAME: iot-service
  IOT_CORE_PROMETHEUS_HOST: 0.0.0.0
  IOT_CORE_PROMETHEUS_PORT: "9101"
  IOT_CORE_PROMETHEUS_PATH: /metrics
