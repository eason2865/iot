apiVersion: v1
kind: Namespace
metadata:
  name: emqx
---
apiVersion: apps.emqx.io/v2
kind: EMQX
metadata:
  name: emqx
  namespace: emqx
spec:
  # The bundled community license supports one node for local integration.
  image: emqx/emqx-enterprise:6.3.1
  imagePullPolicy: IfNotPresent
  config:
    data: |
      authentication = [
        {
          mechanism = password_based
          backend = http
          method = post
          url = "http://iot-core.iot.svc.cluster.local:9090/internal/mqtt/authenticate"
          headers {
            "content-type" = "application/json"
            "x-iot-auth-token" = "${IOT_CORE_MQTT_AUTH_TOKEN}"
          }
          body {
            username = "${username}"
            password = "${password}"
            clientid = "${clientid}"
          }
        }
      ]
      authorization.no_match = deny
  coreTemplate:
    spec:
      replicas: 1
      minAvailable: 1
      env:
        - name: IOT_CORE_MQTT_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: iot-runtime-secrets
              key: IOT_CORE_MQTT_AUTH_TOKEN
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeClaimTemplates:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  listenersServiceTemplate:
    spec:
      type: LoadBalancer
  dashboardServiceTemplate:
    spec:
      type: LoadBalancer
