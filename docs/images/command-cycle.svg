<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<title id="title">IoT 3.0 command lifecycle</title><desc id="desc">Command creation, asynchronous dispatch, device acknowledgement or timeout and read-only diagnosis.</desc>
