<path d="M80 144 L266 144" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="173.0" y="138" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">POST …/commands</text>
<path d="M266 181 L448 181" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="357.0" y="175" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">gRPC CreateCommand</text>
<path d="M448 218 L626 218" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="537.0" y="212" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Insert created + traceparent</text>
<path d="M448 255 L266 255" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="357.0" y="249" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Command ID</text>
<path d="M266 288 L80 288" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="173.0" y="282" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">201 Created</text>
<path d="M448 329 L626 329" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="537.0" y="323" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Claim dispatch lease</text>
<path d="M448 366 L808 366" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="628.0" y="360" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Publish command + traceparent</text>
<path d="M448 399 L626 399" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="537.0" y="393" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Mark published</text>
<path d="M808 438 L987 438" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="897.5" y="432" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Consume command</text>
<path d="M987 473 L1162 473" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="1074.5" y="467" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">MQTT QoS 1 publish</text>
<path d="M1162 509 L987 509" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1074.5" y="503" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Broker PUBACK</text>
<path d="M987 545 L626 545" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="806.5" y="539" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Mark sent + start ACK deadline</text>
<path d="M1162 581 L987 581" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1074.5" y="575" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Device result via ACK topic</text>
<path d="M987 617 L626 617" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="806.5" y="611" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">Persist acked or failed</text>
<text x="26" y="651" text-anchor="start" font-size="15" font-weight="400" fill="#183248">Without an ACK, iot-core expires sent commands. A fast device ACK may arrive before the sent update.</text>
<rect x="22" y="675" width="1195" height="109" rx="10" fill="#e7f4ed" stroke="#a7c9b7"/>
<text x="40" y="704" text-anchor="start" font-size="18" font-weight="650" fill="#225b49">Read-only diagnosis after creation</text>
<text x="40" y="734" text-anchor="start" font-size="16" font-weight="400" fill="#183248">Operator → ops-agent → tenant command GET · Prometheus scrape health · Tempo command stages</text>
<text x="40" y="761" text-anchor="start" font-size="14" font-weight="400" fill="#183248">The report includes verified state and timestamps. Model advice is optional and returned separately.</text>
</svg>
