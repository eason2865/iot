images:
  app: iot-app:2.0

replicas:
  managementAPI: 2
  iotCore: 2
  telemetryIngestor: 2
  deviceWorker: 2

# Per-component container resource requests/limits, rendered verbatim into each
# Deployment. Requests are sized for local kind clusters; raise limits in
# production if profiling shows pressure.
resources:
  managementAPI:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  iotCore:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  telemetryIngestor:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  deviceWorker:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kafka:
  # Applied only when a service creates a topic that does not exist yet.
  # Production must raise these (replicationFactor >= 3, minInsyncReplicas >= 2):
  # with minInsyncReplicas=1 a producer using acks=all is no more durable than
  # acks=1, because the in-sync replica set can shrink to the leader alone. See
  # docs/adr/0004. Changing them on an existing topic has no effect, because
  # topic creation is idempotent; alter live topics with kafka-configs instead.
  topicReplicationFactor: 1
  topicMinInsyncReplicas: 1
  # How long a dead letter stays replayable. Bounds the iot.dlq backlog; only
  # applied when this release creates the topic.
  dlqRetentionMs: 604800000

deviceWorker:
  # Optional tenant isolation. Empty (the default) means the worker processes
  # every tenant, which matches the behaviour before the allowlist existed.
  # Set a comma-separated tenant list to make this worker ignore the rest.
  tenantIDs: ""

security:
  # Supply real values from an external secret manager in production. The local
  # deployment script creates this Kubernetes Secret for integration tests.
  # Required keys: MANAGEMENT_API_TOKEN, EMQX_PASSWORD, EMQX_INTERNAL_PASSWORD,
  # IOT_CORE_MQTT_AUTH_TOKEN, POSTGRES_DSN, TDENGINE_DSN.
  existingSecret: iot-runtime-secrets

# Mutual TLS for the iot-core gRPC channel (port 9001). When enabled, iot-core
# requires and verifies client certificates and management-api presents the
# client certificate from the same Secret. The Secret must contain:
# ca.crt, server.crt, server.key, client.crt, client.key.
grpcTLS:
  enabled: false
  secretName: iot-grpc-tls
  mountPath: /etc/iot/grpc-tls

# The chart deploys application services only. Dependencies are managed outside
# this release, locally by Docker Compose and in production by their own stack.
# DSNs (postgres/tdengine) are intentionally absent here: they carry
# credentials and must come from the Secret referenced by security.existingSecret.
externalDependencies:
  hostGatewayIP: 192.168.65.254
  kafkaBrokers: 192.168.65.254:29092
  emqxUrl: tcp://emqx-listeners.emqx.svc.cluster.local:1883
  wait:
    postgresHost: 192.168.65.254
    postgresPort: 5432
    kafkaHost: 192.168.65.254
    kafkaPort: 29092
    emqxHost: emqx-listeners.emqx.svc.cluster.local
    emqxPort: 1883
    tdengineHost: 192.168.65.254
    tdenginePort: 6041
