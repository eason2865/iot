apiVersion: v1
kind: Service
metadata:
  name: iot-core
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  selector:
    app: iot-core
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
    - name: metrics
      port: 9101
      targetPort: 9101
    - name: mqtt-auth
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core
  labels:
    {{- include "iot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.iotCore }}
  selector:
    matchLabels:
      app: iot-core
  template:
    metadata:
      labels:
        app: iot-core
    spec:
      {{- if .Values.externalDependencies.hostGatewayIP }}
      hostAliases:
        - ip: {{ .Values.externalDependencies.hostGatewayIP | quote }}
          hostnames:
            - host.docker.internal
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z {{ .Values.externalDependencies.wait.postgresHost }} {{ .Values.externalDependencies.wait.postgresPort }}
              && nc -z {{ .Values.externalDependencies.wait.kafkaHost }} {{ .Values.externalDependencies.wait.kafkaPort }};
              do echo waiting for docker postgres/kafka; sleep 2; done
      containers:
        - name: iot-core
          image: {{ .Values.images.app }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/iot-core"]
          envFrom:
            - configMapRef:
                name: iot-common-config
            - secretRef:
                name: {{ .Values.security.existingSecret }}
          {{- if .Values.grpcTLS.enabled }}
          env:
            - name: IOT_CORE_TLS_CERT
              value: {{ .Values.grpcTLS.mountPath }}/server.crt
            - name: IOT_CORE_TLS_KEY
              value: {{ .Values.grpcTLS.mountPath }}/server.key
            - name: IOT_CORE_TLS_CA
              value: {{ .Values.grpcTLS.mountPath }}/ca.crt
          {{- end }}
          ports:
            - containerPort: 9001
            - containerPort: 9101
            - containerPort: 9090
          {{- if .Values.grpcTLS.enabled }}
          volumeMounts:
            - name: grpc-tls
              mountPath: {{ .Values.grpcTLS.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 10
      {{- if .Values.grpcTLS.enabled }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ .Values.grpcTLS.secretName }}
      {{- end }}
