<text x="911.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">消费并落库</text>
<path d="M995 129 L1025 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
