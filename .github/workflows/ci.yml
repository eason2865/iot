name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      kafka:
        image: bitnamilegacy/kafka:4.0.0@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
        env:
          KAFKA_CFG_NODE_ID: "1"
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_LISTENERS: HOST://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: HOST://localhost:9092
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: HOST
          ALLOW_PLAINTEXT_LISTENER: "yes"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: regression-only
          POSTGRES_DB: iot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IOT_POSTGRES_TEST_DSN: postgres://postgres:regression-only@localhost:5432/iot?sslmode=disable
      IOT_KAFKA_TEST_BROKERS: localhost:9092

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -path ./.git -prune -o -path ./outputs -prune -o -name '*.go' -print))"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race detector
        run: go test -race ./internal/...

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3

      - name: Validate Helm profiles
        run: |
          helm lint charts/iot
          helm lint charts/iot -f charts/iot/values-production.yaml
          helm template iot charts/iot > /dev/null
          helm template iot charts/iot -f charts/iot/values-production.yaml > /dev/null

      - name: Build binaries
        run: make build

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.2"

      - name: Install protoc plugins
        run: make proto-tools

      - name: Check generated protobuf files are up to date
        run: |
          make proto
          git diff --exit-code -- proto/
