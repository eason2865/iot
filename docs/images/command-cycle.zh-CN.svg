<path d="M448 366 L808 366" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="628.0" y="360" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">发布命令并传递 traceparent</text>
<path d="M448 399 L626 399" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="537.0" y="393" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">记录 published</text>
<path d="M808 438 L987 438" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="897.5" y="432" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">消费命令</text>
<path d="M987 473 L1162 473" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="1074.5" y="467" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">MQTT QoS 1 下发</text>
<path d="M1162 509 L987 509" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1074.5" y="503" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">代理 PUBACK</text>
<path d="M987 545 L626 545" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="806.5" y="539" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">记录 sent 和 ACK 截止时间</text>
<path d="M1162 581 L987 581" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1074.5" y="575" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">设备通过 ACK topic 回执</text>
<path d="M987 617 L626 617" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="806.5" y="611" text-anchor="middle" font-size="13" font-weight="550" fill="#183248" stroke="#f7fafb" stroke-width="4" paint-order="stroke">持久化 acked 或 failed</text>
<text x="26" y="651" text-anchor="start" font-size="15" font-weight="400" fill="#183248">若没有设备 ACK，iot-core 将到期的 sent 命令置为 timeout。快速回执可能先于 sent 更新。</text>
<rect x="22" y="675" width="1195" height="109" rx="10" fill="#e7f4ed" stroke="#a7c9b7"/>
<text x="40" y="704" text-anchor="start" font-size="18" font-weight="650" fill="#225b49">创建命令后的只读诊断</text>
<text x="40" y="734" text-anchor="start" font-size="16" font-weight="400" fill="#183248">运维人员 → ops-agent → 租户命令 GET、Prometheus 抓取状态、Tempo 命令阶段</text>
<text x="40" y="761" text-anchor="start" font-size="14" font-weight="400" fill="#183248">诊断返回已确认的状态和阶段时间，可选的模型建议单独呈现。</text>
</svg>
