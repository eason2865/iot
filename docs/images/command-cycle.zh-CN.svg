<path d="M626 104 L626 635" stroke="#476379" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
<rect x="736" y="65" width="144" height="38" rx="7" fill="#deedf4" stroke="#abc1cb"/>
