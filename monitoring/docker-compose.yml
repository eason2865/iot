name: iot

services:
  k8s-forward-management-api:
    image: rancher/kubectl:v1.26.8
    container_name: iot-k8s-forward-management-api
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/management-api", "18080:8080", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  k8s-forward-management-api-metrics:
    image: rancher/kubectl:v1.26.8
    container_name: iot-k8s-forward-management-api-metrics
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/management-api", "18090:9100", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  k8s-forward-telemetry-ingestor:
    image: rancher/kubectl:v1.26.8
    container_name: iot-k8s-forward-telemetry-ingestor
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/telemetry-ingestor", "18081:8080", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  k8s-forward-device-worker:
    image: rancher/kubectl:v1.26.8
    container_name: iot-k8s-forward-device-worker
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/device-worker", "18082:8080", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  k8s-forward-iot-core:
    image: rancher/kubectl:v1.26.8
    container_name: iot-k8s-forward-iot-core
    restart: unless-stopped
    command: ["--kubeconfig=/root/.kube/config", "--server=https://desktop-control-plane:6443", "--tls-server-name=localhost", "port-forward", "--address=0.0.0.0", "svc/iot-core", "18091:9101", "-n", "iot"]
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${HOME}/.kube/config}:/root/.kube/config:ro
    networks: [default, kind]

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot123}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://192.168.65.254:29092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: HOST
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka

  tdengine:
    image: tdengine/tdengine:latest
    container_name: tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6044:6044"
      - "6046:6046"
      - "6047:6047"
      - "6048:6048"
      - "6049:6049"
      - "6060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
      - tdengine-corefile:/corefile

  emqx:
    image: emqx/emqx-enterprise:6.3.1
    container_name: emqx
    restart: unless-stopped
    environment:
      # Keep the existing single-node Mnesia identity stable across upgrades.
      EMQX_NODE_NAME: emqx@127.0.0.1
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  demo:
    image: iot-app:2.0
    container_name: iot-demo
    restart: unless-stopped
    command: ["/usr/local/bin/demo"]
    ports:
      - "18084:8080"
    environment:
      DEMO_MANAGEMENT_API_URL: http://k8s-forward-management-api:18080
      DEMO_MQTT_URL: tcp://host.docker.internal:1883
      DEMO_TENANT_COUNT: "5"
      DEMO_DEVICES_PER_TENANT: "10"
      DEMO_TENANT_PREFIX: demo
      DEMO_PRODUCT_ID: product-demo
      DEMO_TICK_INTERVAL: 250ms
      DEMO_TELEMETRY_BURST_MIN: "1"
      DEMO_TELEMETRY_BURST_MAX: "5"
      DEMO_COMMAND_BURST_MIN: "1"
      DEMO_COMMAND_BURST_MAX: "3"
      LISTEN_ADDR: :8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      emqx:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  postgres-data:
    name: iot-postgres-data
  kafka-data:
    name: iot-kafka-data
  tdengine-data:
    name: iot-tdengine-data
  tdengine-log:
    name: iot-tdengine-log
  tdengine-corefile:
    name: iot-tdengine-corefile
  emqx-data:
    name: iot-emqx-data
  emqx-log:
    name: iot-emqx-log
  prometheus-data:
    name: iot-prometheus-data
  grafana-data:
    name: iot-grafana-data

networks:
  kind:
    external: true
    name: kind
