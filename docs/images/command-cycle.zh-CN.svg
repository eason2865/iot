<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<title id="title">IoT 3.0 命令生命周期</title><desc id="desc">命令创建、异步派发、设备回执或超时，以及独立的只读诊断。</desc>
