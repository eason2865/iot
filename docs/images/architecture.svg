<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 682" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<title id="title">IoT 3.0 architecture</title><desc id="desc">Device traffic runs independently of the optional operations agent.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#476379"/></marker></defs>
<rect width="1220" height="682" rx="12" fill="#f7fafb"/>
<text x="28" y="44" text-anchor="start" font-size="28" font-weight="700" fill="#183248">IoT 3.0  /  System architecture</text>
<text x="28" y="84" text-anchor="start" font-size="18" font-weight="650" fill="#183248">Telemetry ingestion</text>
<rect x="28" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="111.0" y="123" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Device</text>
<text x="111.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">publish telemetry</text>
<path d="M195 129 L225 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="228" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="311.0" y="123" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">EMQX</text>
<text x="311.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">MQTT</text>
<path d="M395 129 L425 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="428" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="511.0" y="123" text-anchor="middle" font-size="14" font-weight="650" fill="#183248">telemetry-ingestor</text>
<text x="511.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">normalize</text>
<path d="M595 129 L625 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="628" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="711.0" y="123" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Kafka</text>
<text x="711.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">iot.telemetry</text>
<path d="M795 129 L825 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="828" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="911.0" y="123" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">device-worker</text>
<text x="911.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">consume and persist</text>
<path d="M995 129 L1025 129" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="1028" y="99" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="1111.0" y="123" text-anchor="middle" font-size="14" font-weight="650" fill="#183248">Postgres / TDengine</text>
<text x="1111.0" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">state / time series</text>
<text x="28" y="196" text-anchor="start" font-size="18" font-weight="650" fill="#183248">Device commands</text>
<rect x="28" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="111.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">management-api</text>
<text x="111.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">tenant REST API</text>
<path d="M195 241 L225 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="228" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="311.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">iot-core</text>
<text x="311.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">Postgres lease + dispatch</text>
<path d="M395 241 L425 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="428" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="511.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Kafka</text>
<text x="511.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">iot.command</text>
<path d="M595 241 L625 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="628" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="711.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">device-worker</text>
<text x="711.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">deliver over MQTT</text>
<path d="M795 241 L825 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="828" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="911.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">EMQX</text>
<text x="911.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">broker confirmation</text>
<path d="M995 241 L1025 241" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="1028" y="211" width="166" height="60" rx="8" stroke="#a3bcc7" fill="#e4f0f6"/>
<text x="1111.0" y="235" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Device</text>
<text x="1111.0" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">execute and ACK</text>
<text x="28" y="300" text-anchor="start" font-size="14" font-weight="400" fill="#183248">ACK returns through EMQX to device-worker, which records the result in PostgreSQL.</text>
<rect x="18" y="325" width="1185" height="260" rx="12" fill="#eef7f2" stroke="#a7c9b7"/>
<text x="34" y="359" text-anchor="start" font-size="20" font-weight="650" fill="#225b49">Read-only operations  /  optional Helm Deployment</text>
<rect x="37" y="404" width="166" height="62" rx="8" stroke="#a3bcc7" fill="#fff"/>
<text x="120.0" y="428" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">Operator</text>
<text x="120.0" y="449" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">tenant operator token</text>
<path d="M204 436 L248 436" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="251" y="404" width="175" height="62" rx="8" stroke="#a3bcc7" fill="#d1ecdf"/>
<text x="338.5" y="428" text-anchor="middle" font-size="16" font-weight="650" fill="#183248">ops-agent</text>
<text x="338.5" y="449" text-anchor="middle" font-size="12" font-weight="400" fill="#183248">fixed tools · HTTP 8084</text>
<path d="M427 436 L489 436" stroke="#476379" stroke-width="1.6" fill="none"/>
<path d="M489 393 L489 527" stroke="#476379" stroke-width="1.6" fill="none"/>
<path d="M489 393 L532 393" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="547" y="398" text-anchor="start" font-size="16" font-weight="650" fill="#183248">management-api</text>
<text x="757" y="398" text-anchor="start" font-size="15" font-weight="400" fill="#183248">GET one command with a tenant read credential</text>
<path d="M489 437 L532 437" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="547" y="442" text-anchor="start" font-size="16" font-weight="650" fill="#183248">Prometheus</text>
<text x="757" y="442" text-anchor="start" font-size="15" font-weight="400" fill="#183248">Worker scrape status at command update time</text>
<path d="M489 481 L532 481" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="547" y="486" text-anchor="start" font-size="16" font-weight="650" fill="#183248">Tempo</text>
<text x="757" y="486" text-anchor="start" font-size="15" font-weight="400" fill="#183248">Search sampled spans by command ID</text>
<path d="M489 527 L532 527" stroke="#476379" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="547" y="532" text-anchor="start" font-size="16" font-weight="650" fill="#183248">Model endpoint</text>
<text x="757" y="532" text-anchor="start" font-size="15" font-weight="400" fill="#183248">Question and filtered evidence → optional advice</text>
<text x="34" y="568" text-anchor="start" font-size="14" font-weight="400" fill="#183248">The four business services export OpenTelemetry traces to Tempo using OTLP when configured.</text>
<text x="32" y="619" text-anchor="start" font-size="17" font-weight="650" fill="#183248">Supporting services</text>
<text x="32" y="647" text-anchor="start" font-size="14" font-weight="400" fill="#183248">EMQX → iot-core for device authentication  ·  Failed messages → Kafka DLQ  ·  Grafana → Prometheus / Tempo  ·  Demo → REST / MQTT</text>
</svg>
